name: CatDrop 錯誤回報
description: 回報可重現的啟動、傳檔或環境問題
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        回報前請先執行 `check.bat`。公開附件前，請檢查並遮蔽個人路徑、裝置名稱或其他敏感資訊；不要上傳接收檔案或資料庫。
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 請依序列出操作方式、預期結果與實際結果。
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: 錯誤訊息
      description: 貼上畫面或終端顯示的完整錯誤訊息。
      render: text
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 診斷報告
      description: 貼上 `logs/diagnostic-latest.txt`，並先遮蔽不想公開的個人路徑。
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 應用程式日誌
      description: 貼上 `logs/catdrop.log` 中與問題時間相符的片段，不要貼上檔案內容或資料庫。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隱私確認
      options:
        - label: 我已檢查內容，未附上接收檔案、資料庫或不應公開的個人資訊。
          required: true
